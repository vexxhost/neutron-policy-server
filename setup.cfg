[metadata]
name = neutron-policy-checks
summary = oslo.policy checks for advanced Neutron policies
description_file =
    README.rst
author = VEXXHOST, Inc.
author_email = support@vexxhost.com
url = https://vexxhost.github.io/neutron-policy-checks/
project_urls =
    Bug Tracker = https://github.com/vexxhost/neutron-policy-checks/issues
    Documentation = https://vexxhost.github.io/neutron-policy-checks/
    Source Code = https://github.com/vexxhost/neutron-policy-checks
python_requires = >=3.8
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: OpenStack
    Intended Audience :: Information Technology
    Intended Audience :: System Administrators
    License :: OSI Approved :: Apache Software License
    Operating System :: POSIX :: Linux
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: Implementation :: CPython

[files]
packages =
    neutron_policy_checks

[entry_points]
oslo.policy.rule_checks =
    address_pair = neutron_policy_checks.checks:AddressPairCheck
    port_update = neutron_policy_checks.checks:PortUpdateCheck
    port_delete = neutron_policy_checks.checks:PortDeleteCheck
    quarantine = neutron_policy_checks.checks:QuarantineCheck
